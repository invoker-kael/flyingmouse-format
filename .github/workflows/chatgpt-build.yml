name: Custom Release v0.7.3

on:
  push:
    branches:
      - custom
    paths:
      - ".github/workflows/chatgpt-build.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Windows 10/11 x64 Full
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Clean old build branch and stale runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/actions/runs/35060449273/cancel" >/dev/null 2>&1 || true
          gh api -X POST "repos/${{ github.repository }}/actions/runs/35060589783/cancel" >/dev/null 2>&1 || true
          gh api -X POST "repos/${{ github.repository }}/actions/runs/35060656192/cancel" >/dev/null 2>&1 || true
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/chatgpt-build-0.7.3" >/dev/null 2>&1 || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Restore locked Markdown engine
        run: npm run restore:pandoc

      - name: Restore fixed conversion engines
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\restore-ci-engines.ps1

      - name: Validate document structure engine
        shell: powershell
        run: node scripts/lock-docstructure-engine.js --verify --root bin/docstructure --lock docstructure-engine-lock.json

      - name: Stage Thai OCR data
        shell: powershell
        run: |
          $source = 'node_modules\@tesseract.js-data\tha\4.0.0_best_int\tha.traineddata.gz'
          $destination = 'bin\tessdata\tha.traineddata.gz'
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw 'Locked Thai OCR data is missing.'
          }
          Copy-Item -LiteralPath $source -Destination $destination -Force
          $sourceHash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash
          $destinationHash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash
          if ($sourceHash -ne $destinationHash) {
            throw 'Thai OCR data copy failed hash validation.'
          }

      - name: Syntax checks
        run: |
          node --check server.js
          node --check electron-main.js
          node --check electron-security.js
          node --check preload.js
          node --check public/app.js

      - name: Run full test suite
        run: npm test

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build Windows 10/11 x64 installer
        run: npm run dist

      - name: Inspect installer and calculate SHA256
        shell: powershell
        run: |
          $installer = Get-ChildItem -LiteralPath dist -Filter '*Setup-*-x64.exe' |
            Where-Object { $_.Name -notmatch 'win7|Lite' } |
            Select-Object -First 1
          if (-not $installer) {
            throw 'Windows x64 installer was not produced.'
          }
          node scripts/inspect-pe.js $installer.FullName
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash
          Write-Host "INSTALLER=$($installer.Name)"
          Write-Host "SHA256=$hash"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: flyingmouse-format-0.7.3-windows-x64
          path: |
            dist/*Setup-*-x64.exe
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Publish GitHub Release v0.7.3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="v0.7.3"
          NOTES="docs/release-notes-073.md"

          git fetch --tags --force

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG already exists at $TAG_COMMIT, expected $GITHUB_SHA. Refusing to move an existing tag."
              exit 1
            fi
          fi

          mkdir -p release-assets
          cp dist/*Setup-*-x64.exe release-assets/
          cp dist/*.blockmap release-assets/ 2>/dev/null || true
          cp dist/latest.yml release-assets/ 2>/dev/null || true

          cd release-assets
          for f in *; do
            [ -e "$f" ] || continue
            n="$(basename "$f" | tr ' ' '-')"
            [ "$(basename "$f")" = "$n" ] || mv "$f" "$n"
          done
          cd ..

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Refusing to overwrite an existing release."
            exit 1
          fi

          gh release create "$TAG"             --repo "${{ github.repository }}"             --target "$GITHUB_SHA"             --title "FlyingMouse Format $TAG"             --notes-file "$NOTES"             --draft

          gh release upload "$TAG" release-assets/*             --repo "${{ github.repository }}"

          gh release edit "$TAG"             --repo "${{ github.repository }}"             --draft=false             --latest
